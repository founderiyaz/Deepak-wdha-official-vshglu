<script>

let seconds = 25;

const countdownEl = document.getElementById("countdown");
const redirectEl = document.getElementById("redirectMsg");

      "00 : 00 : 00 : " +
      String(seconds).padStart(2, '0');

      "Redirecting in " + seconds + " seconds...";
